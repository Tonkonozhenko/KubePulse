[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
kubepulse-builtin = { path = "crates/kubepulse-builtin" }
kubepulse-cluster = { path = "crates/kubepulse-cluster" }
kubepulse-extension-api = { path = "crates/kubepulse-extension-api" }
kubepulse-extension-host = { path = "crates/kubepulse-extension-host" }
kubepulse-store = { path = "crates/kubepulse-store" }
kubepulse-ui = { path = "crates/kubepulse-ui" }

# Upgrade the kit and every snapshot crate together in one commit.
gpui-kit = "=0.9.0"

async-trait = "0.1"
backon = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "6"
futures = "0.3"
internment = { version = "0.8", default-features = false, features = ["arc"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
kube = { version = "5", default-features = false, features = ["client", "rustls-tls", "ring", "oidc", "oauth", "runtime"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
similar = "2"
yaml_serde = "0.10"
rust-i18n = "4"
stats_alloc = "0.1"
sys-locale = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

tempfile = "3"
tracing-subscriber = "0.3"
wiremock = "0.6"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
