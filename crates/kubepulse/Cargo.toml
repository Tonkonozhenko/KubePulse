[package]
name = "kubepulse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight, native Kubernetes IDE"
publish.workspace = true

[dependencies]
kubepulse-builtin.workspace = true
kubepulse-cluster.workspace = true
kubepulse-extension-host.workspace = true
kubepulse-store.workspace = true
kubepulse-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
async-trait.workspace = true
kubepulse-extension-api.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[package.metadata.packager]
product-name = "KubePulse"
identifier = "dev.kubepulse.app"
authors = ["Alex Tonkonozhenko"]
category = "DeveloperTool"
before-packaging-command = "cargo build --release --locked -p kubepulse"
out-dir = "../../target/packager"
license-file = "../../LICENSE"
icons = ["../../assets/logo-256.png", "../../assets/logo.ico"]
binaries = [{ path = "kubepulse", main = true }]

[package.metadata.packager.deb]
package-name = "kubepulse"
desktop-template = "../../assets/kubepulse.desktop"
depends = [
    "libc6",
    "libgcc-s1",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libwayland-egl1",
    "libegl1",
    "libvulkan1",
]

[package.metadata.packager.deb.files]
"../../LICENSE" = "usr/share/doc/kubepulse/copyright"
"../../assets/third-party-notices.txt" = "usr/share/doc/kubepulse/third-party-notices.txt"
